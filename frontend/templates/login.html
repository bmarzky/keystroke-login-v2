{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="card">
    <h2>Login</h2>
    <div id="message"></div>

    <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Masukkan username" autofocus>
    </div>

    <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Masukkan password">
    </div>

    <button onclick="handleLogin()">Login</button>
    <p>Belum punya akun? <a href="/register">Register</a></p>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
    const usernameField = document.getElementById('username')
    const passwordField = document.getElementById('password')

    usernameField.focus()

    usernameField.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault()
            passwordField.focus()
        }
    })

    passwordField.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault()
            handleLogin()
        }
    })
})

async function handleLogin() {
    const usernameField = document.getElementById('username')
    const passwordField = document.getElementById('password')
    const username      = usernameField.value.trim()
    const password      = passwordField.value
    const keystroke     = collector.collect()

    if (!username || !password) {
        showMessage('Username dan password wajib diisi', 'error')
        return
    }

    const response = await fetch('/api/login', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ username, password, keystroke })
    })

    const data = await response.json()

    usernameField.value = ''
    passwordField.value = ''
    collector.reset()

    if (response.ok) {
        showMessage(`Login berhasil — sesi ke-${data.login_count}`, 'success')
    } else {
        showMessage(data.error, 'error')
    }

    usernameField.focus()
}

function showMessage(text, type) {
    const msg = document.getElementById('message')
    msg.textContent = text
    msg.className   = type
}
</script>
{% endblock %}
